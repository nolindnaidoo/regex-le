# CodeQL, advanced setup. Identical in every *-le repo.
#
# Advanced rather than GitHub's default setup because default setup cannot
# exclude paths, and scanning test fixtures produces findings that exist only
# to be dismissed — see .github/codeql-config.yml.
name: CodeQL

on:
  # A prose commit cannot change what a code scanner finds, and this workflow
  # is four jobs. The weekly run below is what keeps coverage honest — it
  # reaches the whole repository whether or not anything was pushed — so
  # skipping a scan of unchanged code costs nothing.
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  schedule:
    # Weekly, so new queries reach existing code without waiting for a commit.
    - cron: "27 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ matrix.language }}"
