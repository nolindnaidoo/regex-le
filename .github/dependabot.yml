# Security updates only. Identical in every *-le repo.
#
# `open-pull-requests-limit: 0` turns version updates off for an ecosystem and
# leaves security updates on. Those are raised from the repository's Dependabot
# alerts, not from the schedule, which is here because the schema requires it.
# Everything else moves by hand, on purpose.
#
# The ecosystem is "bun", not "npm": the npm updater edits package.json without
# regenerating bun.lock, so its PRs can never pass the CI frozen-lockfile gate.
# The bun updater maintains the lockfile.
#
# The Rust toolchain has no entry. No advisory database covers toolchain
# releases, so an entry limited to security updates could never open a pull
# request. The pin in crate/rust-toolchain.toml is raised by hand.
#
# Auto-merge is handled by .github/workflows/dependabot-auto-merge.yml, which
# merges any update but a major once CI concludes green.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      # Must track engines.vscode. Raising this raises the supported VS Code
      # floor and drops users below it — a product decision, not a bump.
      - dependency-name: "@types/vscode"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # The crate is Rust, and nothing above covers it.
  - package-ecosystem: "cargo"
    directories: ["/crate"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
